[printer Voron Trident]
moonraker_host: 192.168.1.27
moonraker_port: 7125
moonraker_api_key: False
z_babystep_values: 0.01, 0.05
extrude_distances: 5, 10, 25, 50
extrude_speeds: 1, 2, 5, 25

[preheat ABS]
extruder: 220
heater_bed: 110
heater_generic: 50
gcode:
  SET_IDLE_TIMEOUT TIMEOUT=7200
  _status_heating

[preheat ASA]
extruder: 220
heater_bed: 110
heater_generic: 50
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=7200
    _status_heating

[preheat PLA]
extruder: 190
heater_bed: 60
gcode:
  SET_IDLE_TIMEOUT TIMEOUT=7200
  _status_heating
  
[preheat PETG]
extruder: 240
heater_bed: 80
gcode:
  SET_IDLE_TIMEOUT TIMEOUT=7200
  _status_heating

[preheat TPU]
extruder: 210
heater_bed: 75
gcode:
  SET_IDLE_TIMEOUT TIMEOUT=7200
  _status_heating

[preheat PC]
extruder: 265
heater_bed: 110
heater_generic: 50
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=7200
    _status_heating

[preheat Heatsoak]
extruder: 240
heater_bed: 120
heater_generic: 50
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=7200
    _status_heating


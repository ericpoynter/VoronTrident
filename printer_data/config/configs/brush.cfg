[gcode_macro CLEAN_NOZZLE]
variable_start_x: 200
variable_start_y: 301
variable_start_z: 0
variable_wipe_dist: 30
variable_wipe_qty: 2
variable_wipe_spd: 400
variable_raise_distance: 15

gcode:
 _CG28
 G90
 G1 X{start_x} Y{start_y} F6000
 
 {% for wipes in range(1, (wipe_qty + 1)) %}
   G1 X{start_x +  wipe_dist} Y{start_y} F{wipe_spd * 60}
   G1 X{start_x} Y{start_y} F{wipe_spd * 60}
   G1 X{start_x + wipe_dist} Y{start_y} F{wipe_spd * 60}
   G1 X{start_x} Y{start_y} F{wipe_spd * 60}
 {% endfor %}
 
 G1 X250 Y307 F3000 ; Park nozzle (adjust to your printer)

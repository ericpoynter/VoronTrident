[bed_mesh]
zero_reference_position: 150, 150
speed: 200
mesh_min: 20, -5
mesh_max: 280,240
probe_count: 10,10
algorithm: bicubic

[z_tilt]
z_positions:
   -50, 10
   150, 240
   350, 18
points:
   30, 0
   150, 240
   270, 0
speed: 400
horizontal_move_z: 3
retries: 5
retry_tolerance: 0.0075

[gcode_macro _CG28]
gcode:
    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
    G28
    {% endif %}
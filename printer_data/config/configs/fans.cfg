[fan]
pin: NHK:gpio6
max_power: 1.0
kick_start_time: 0.5                   
off_below: 0.13
cycle_time: 0.01
hardware_pwm: false

[heater_fan hotend_fan]
pin: NHK:gpio5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[controller_fan controller_fan]
pin: PF7
heater: heater_bed
kick_start_time: 0.5
max_power: 0.5
################## Load ##################
[gcode_macro LOAD_FILAMENT]
gcode:
      FILAMENT_LOAD
      
[gcode_macro FILAMENT_LOAD]
gcode:
      _CG28
      G91
      G1 Z10
      G90
      G1 E100 F300
      G1 E-0.2 F3600
      
################## Unload ##################  
[gcode_macro UNLOAD_FILAMENT]
gcode:
      FILAMENT_UNLOAD
      
[gcode_macro FILAMENT_UNLOAD]
gcode:     
      _CG28
      G91
      G1 Z10
      G90
      G1 X250 Y294
      G1 E1 F1500    
      G1 E-80 F1500
      SPOOL_CLEAR_ACTIVE
      
################## Change ################## 
[gcode_macro FILAMENT_CHANGE]
gcode:
      _CG28
      G91      
      G1 Z10
      G90
      G1 X250 Y294 F3000
      G91   
      SPOOL_CLEAR_ACTIVE

[gcode_macro M600]
gcode:
    {% set X = params.X|default(250)|float %}
    {% set Y = params.Y|default(294)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91   
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91   
    RESTORE_GCODE_STATE NAME=M600_state
[stepper_x]
step_pin: PB10
dir_pin: !PB11
enable_pin: !PG0
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100   #Max 100
homing_retract_dist: 0
homing_positive_dir: true

[stepper_y]
step_pin: PF15
dir_pin: !PF14
enable_pin: !PE9
rotation_distance: 39.84  #per califlower measurements  #40
microsteps: 32
full_steps_per_rotation:400
endstop_pin: PC2
position_min: -10
position_endstop: 300
position_max: 302
homing_speed: 100  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[stepper_z]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD7
rotation_distance: 4
microsteps: 32
endstop_pin:  probe:z_virtual_endstop
position_max: 280
position_min: -5
homing_speed: 5
second_homing_speed: 3
homing_retract_dist: 3

[stepper_z1]
step_pin: PC12
dir_pin: PC11
enable_pin: !PD2
rotation_distance: 4
microsteps: 32

[stepper_z2]
step_pin: PC9
dir_pin: PC8
enable_pin: !PC10
rotation_distance: 4  
microsteps: 32
[stepper_x]
step_pin: PB10
dir_pin: !PB11
enable_pin: !PG0
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400
endstop_pin: NHK:gpio13
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100  
homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
step_pin: PF15
dir_pin: !PF14
enable_pin: !PE9
rotation_distance: 39.84  #per califlower measurements  #40
microsteps: 32
full_steps_per_rotation:400
endstop_pin: PC2
position_min: -2
position_endstop: 305
position_max: 307
homing_speed: 100
homing_retract_dist: 5
homing_positive_dir: true

[stepper_z]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD7
rotation_distance: 4
microsteps: 32
endstop_pin:  probe:z_virtual_endstop
position_max: 280
position_min: -5
homing_speed: 10
second_homing_speed: 50
homing_retract_dist: 0

[stepper_z1]
step_pin: PC12
dir_pin: PC11
enable_pin: !PD2
rotation_distance: 4
microsteps: 32

[stepper_z2]
step_pin: PC9
dir_pin: PC8
enable_pin: !PC10
rotation_distance: 4  
microsteps: 32

[extruder]
step_pin: NHK:gpio23
dir_pin: NHK:gpio24
enable_pin: !NHK:gpio25
full_steps_per_rotation: 200
microsteps: 16
#gear_ratio: 9:1
nozzle_diameter: 0.400
filament_diameter: 1.75
rotation_distance: 4.637  #New RD = Old RD *(120-x)/100  #####  G1 E100 F100   ####
heater_pin: NHK:gpio9
sensor_pin: NHK:gpio29
pullup_resistor: 2200
sensor_type: ATC Semitec 104NT-4-R025H42G
#########   PID_CALIBRATE HEATER=extruder TARGET=245  PCF 25%    ###########
smooth_time: 2.0
min_temp: 0
max_temp: 290
max_power: 1.0
min_extrude_temp: 180
max_extrude_only_distance: 300
max_extrude_only_velocity: 120
max_extrude_cross_section: 5
pressure_advance: 0.025
pressure_advance_smooth_time: 0.040

[verify_heater extruder]
max_error: 240
check_gain_time: 240
#Raspberry Pi 4 Model B Rev 1.5
#PRETTY_NAME="Debian GNU/Linux 12 (bookworm)"
#NAME="Debian GNU/Linux"
#VERSION_ID="12"
#VERSION="12 (bookworm)"
#VERSION_CODENAME=bookworm

#LDO Levithian v1.3
#STM32H743

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

[mcu NHK]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3033393834053043-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 4000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[include configs/*.cfg]
[include configs/AFC/*.cfg]
[include configs/KAMP/*.cfg]

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos    : True  # allows customized toolhead positioning during pause, cancel, or timelapse events
variable_custom_park_x     : 250
variable_custom_park_y     : 307
#variable_custom_park_dz    : 10.0  # custom dz value; the value in mm to lift the nozzle when move to park position
#variable_retract           : 2.0   # the value to retract while PAUSE
#variable_cancel_retract    : 2.0   # the value to retract while CANCEL_PRINT
#variable_speed_retract     : 35.0  # retract speed in mm/s
#variable_unretract         : 1.8   # the value to unretract while RESUME
#variable_speed_unretract   : 35.0  # unretract speed in mm/s
#variable_speed_hop         : 15.0  # z move speed in mm/s
#variable_speed_move        : 100.0 # move speed in mm/s
variable_park_at_cancel    : True # allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
variable_park_at_cancel_x  : 250    # different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y  : 307    # different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
#variable_use_fw_retract    : False # use fw_retraction instead of the manual version [True/False]
#variable_idle_timeout      : 14400     # time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
